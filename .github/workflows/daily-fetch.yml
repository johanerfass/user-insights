name: Rider signal board — daily fetch

on:
  schedule:
    # 06:00 UTC daily. Adjust to whenever the office TV should refresh.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install optional dependencies
        working-directory: app
        run: npm install --omit=dev

      - name: Fetch posts and rebuild data.json
        working-directory: app
        env:
          TRUSTPILOT_API_KEY: ${{ secrets.TRUSTPILOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run fetch

      - name: Commit updated data.json
        run: |
          git config user.name "voi-rider-signal-bot"
          git config user.email "actions@github.com"
          git add app/public/data.json
          git diff --cached --quiet || git commit -m "chore: daily rider signal refresh"
          git push
